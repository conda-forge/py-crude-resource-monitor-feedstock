context:
  name: py-crude-resource-monitor
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/I-Al-Istannen/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a82cbc2842c34b322bd70beab12f1e866a8179c83263fa9e083c235d0aa317f8
  patches:
    - if: win
      then: 0001-pnpm-bat.patch

build:
  number: 0

requirements:
  build:
    - pnpm
    - pnpm-licenses
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - if: unix
      then:
        - pkg-config
  host:
    - if: unix
      then:
        - zstd
    - if: linux
      then:
        - libunwind
        - liblzma-devel

tests:
  - script:
      - py-crude-resource-monitor --help

about:
  homepage: https://github.com/I-Al-Istannen/${{ name }}
  summary: A memory and cpu utilization monitor that correlates the data with Python stacktraces. Supports multiprocessing.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - THIRDPARTY-frontend.yml

extra:
  recipe-maintainers:
    - pavelzw
